services:
  - type: web
    name: centinela-ia
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_TIMEZONE
        value: America/Mexico_City
      - key: CENTINELA_DB
        value: /app/data/centinela.sqlite3
      - key: CENTINELA_MODELOS_VOZ
        value: /app/data/modelos_piper
      - key: CENTINELA_INTERNAL_REMINDERS
        value: "1"
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"
      - key: HF_HUB_DISABLE_TELEMETRY
        value: "1"
